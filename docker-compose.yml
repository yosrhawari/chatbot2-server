services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - LOG_FORMAT=json
      - CORS_ORIGINS=http://localhost:8501,http://frontend:8501
    volumes:
      - chroma_data:/app/backend/chroma_db
      - cache_data:/app/backend/cache
      - huggingface_cache:/root/.cache/huggingface
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2600s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend_streamlit/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  chroma_data:
  cache_data:
  huggingface_cache:
